<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Broker Monitor</title>
  <meta name="description" content="Live monitor for the SQLite message broker">
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <main>
    <h1>Broker Monitor</h1>
    <section aria-labelledby="key-title">
      <h2 id="key-title">Session</h2>
      <form id="key-form" aria-label="Admin API key">
        <label for="api-key">API key (admin)</label>
        <input id="api-key" type="password" autocomplete="off" required>
        <button type="submit">Connect</button>
        <button type="button" id="disconnect">Disconnect</button>
      </form>
      <p id="status" role="status" aria-live="polite">Disconnected</p>
    </section>
    <section aria-labelledby="q-title">
      <h2 id="q-title">Queues</h2>
      <table id="queues" aria-live="polite">
        <thead>
          <tr><th scope="col">Queue</th><th scope="col">Pending</th><th scope="col">Processing</th><th scope="col">Done</th><th scope="col">Dead</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script type="module" src="/static/admin.js"></script>
</body>
</html>
